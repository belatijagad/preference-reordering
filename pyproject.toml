[project]
name = "preference-reordering"
version = "0.1.0"
description = "Code for Show, Don't Tell: Aligning Language Models with Demonstrated Feedback"
readme = "README.md"
requires-python = ">=3.10.9,<3.11"
dependencies = [
    "accelerate==0.30.1",
    "datasets==2.19.1",
    "einops==0.8.0",
    "evaluate==0.4.0",
    "hf-transfer>=0.1.4",
    "huggingface-hub==0.23.1",
    "jinja2>=3.0.0",
    "ninja>=1.11.1",
    "numpy==1.24.2",
    "packaging>=23.0",
    "peft==0.9.0",
    "protobuf<=3.20.2",
    "rich>=11.1.0",
    "safetensors>=0.3.3",
    "scipy",
    "sentencepiece>=0.1.99",
    "tensorboard",
    "torch==2.7.1",
    "tqdm>=4.64.1",
    "transformers==4.41.1",
    "trl==0.8.6",
]

[project.optional-dependencies]
# Install this extra only on the remote Linux CUDA machine.
remote-cuda = [
    "flash-attn==2.8.3.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "hf-doc-builder>=0.4.0",
    "parameterized>=0.9.0",
    "pytest",
    "ruff>=0.12.0",
]
notebooks = [
    "jupyterlab",
    "nltk",
    "pandas",
    "scikit-learn",
]

[tool.uv]
package = false
# CUDA extension builds run inside the already-synced project environment so
# they use the exact runtime PyTorch ABI. scripts/sync_remote.sh performs the
# required two-stage sync on a fresh machine.
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
