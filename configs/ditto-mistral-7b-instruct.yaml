# Model arguments
model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
torch_dtype: bfloat16

use_flash_attention_2: true

# Data training arguments
preprocessing_num_workers: 1

# DPOTrainer arguments
bf16: true
fp16: false
do_eval: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
log_level: info
logging_steps: 1
save_strategy: steps
save_steps: 10
save_total_limit: 2

max_length: 2048
max_prompt_length: 512

# Conservative single-GPU defaults; accumulation preserves a useful effective batch.
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
push_to_hub: false
seed: 42

use_peft: true
# Appendix D, Table 5 uses the same LoRA settings for CMCC and CCAT.
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj

learning_rate: 3.0e-5
max_steps: 30
lr_scheduler_type: cosine
warmup_ratio: 0.2

# if a batch gets < 1.00 loss, let's stop
sft_stop_loss: 1.00

ditto_learning_rate: 1.0e-6
ditto_max_steps: 40
ditto_lr_scheduler_type: constant_with_warmup
ditto_warmup_ratio: 0.25

# The collator expands each item by rescale_batch before DPO concatenates each pair.
ditto_per_device_train_batch_size: 1
ditto_gradient_accumulation_steps: 8
rescale_batch: 3
bootstrap_count: 10
resample_rate: 10
generation_max_new_tokens: 1024
generation_temperature: 1.0
generation_batch_size: 1

# SFT removes its source text column after tokenization. DITTOTrainer switches
# this off when it takes over because its online collator needs the raw rows.
remove_unused_columns: true
beta: 0.05

frac_expert: 0.7
frac_replay: 0.2
frac_intermodel: 0.1
